name: Build Android & iOS

on:
  push:
    branches: [ main, master, flutter-app ]
    tags: [ 'v*-flutter' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Build APK
        run: flutter build apk --release
      
      - name: Get version
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | head -1 | awk '{print $2}')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
      
      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk daidai-flutter-v${{ steps.version.outputs.VERSION }}-android.apk
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: daidai-flutter-v${{ steps.version.outputs.VERSION }}-android.apk
          if-no-files-found: error

  build-ios:
    name: Build iOS
    runs-on: macos-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign
        env:
          DEVELOPMENT_TEAM: ""
          CODE_SIGN_IDENTITY: ""
          CODE_SIGNING_REQUIRED: "NO"
          CODE_SIGNING_ALLOWED: "NO"
      
      - name: Get version
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | head -1 | awk '{print $2}')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
      
      - name: Create IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r daidai-flutter-v${{ steps.version.outputs.VERSION }}-ios.ipa Payload/
      
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: daidai-flutter-v${{ steps.version.outputs.VERSION }}-ios.ipa
          if-no-files-found: error

  release:
    name: Create Release
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-files
      
      - name: Download iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa
          path: release-files
      
      - name: Get version
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | head -1 | awk '{print $2}')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          # 确定 release tag：如果是 tag push 就用 ref_name，否则用版本号
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "RELEASE_TAG=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "RELEASE_TAG=v${VERSION}" >> $GITHUB_OUTPUT
          fi
      
      - name: Generate Release Notes
        id: release_notes
        run: |
          RELEASE_TAG="${{ steps.version.outputs.RELEASE_TAG }}"
          # 检查是否有预定义的 release notes 文件
          if [ -f "docs/release-notes/${RELEASE_TAG}.md" ]; then
            echo "file=docs/release-notes/${RELEASE_TAG}.md" >> "$GITHUB_OUTPUT"
          else
            # 自动生成 release notes
            PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
            
            if [ -n "$PREV_TAG" ]; then
              CHANGES=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s" --no-merges)
            else
              CHANGES=$(git log --pretty=format:"- %s" --no-merges -10)
            fi
            
            cat > /tmp/release_notes.md << EOF
          ## ${{ steps.version.outputs.RELEASE_TAG }} 中文更新说明
          
          ### 本版变更
          $CHANGES
          
          ### 下载说明
          - Android：下载本 Release 中的 APK 文件安装。
          - iOS：下载本 Release 中的 IPA 文件，通过 AltStore、Sideloadly 等方式安装。

          ### 开源引用
          - 原始客户端：[Dumb-Panel-APP](https://github.com/linzixuanzz/Dumb-Panel-APP)
          - 后端服务：[daidai-panel](https://github.com/linzixuanzz/daidai-panel)
          - 当前依赖及许可证：[第三方开源声明](https://github.com/${{ github.repository }}/blob/main/docs/THIRD_PARTY_NOTICES.md)
          EOF
            echo "file=/tmp/release_notes.md" >> "$GITHUB_OUTPUT"
          fi
      
      - name: List release files
        run: |
          ls -la release-files/
      
      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES_FILE="${{ steps.release_notes.outputs.file }}"
          RELEASE_TAG="${{ steps.version.outputs.RELEASE_TAG }}"
          
          # 检查 release 是否已存在
          if gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            # 已存在的 Release 保留人工维护的说明，只更新构建产物。
            gh release upload "$RELEASE_TAG" \
              --repo "${{ github.repository }}" \
              release-files/* \
              --clobber
          else
            # 创建新的 release
            gh release create "$RELEASE_TAG" \
              --repo "${{ github.repository }}" \
              --title "v${{ steps.version.outputs.VERSION }}" \
              --notes-file "$NOTES_FILE" \
              release-files/*
          fi
