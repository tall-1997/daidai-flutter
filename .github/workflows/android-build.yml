name: Android Build

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: "构建模式"
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      FLUTTER_VERSION: 3.41.5
      BUILD_MODE: ${{ github.event.inputs.build_mode || 'debug' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve Dart packages
        run: flutter pub get

      - name: Restore Android release keystore
        if: env.BUILD_MODE == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ secrets.ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" || -z "$EXPECTED_CERT_SHA256" ]]; then
            echo "::error::缺少完整的 Android 正式签名 Secret"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/daidai-release.jks
          keytool -exportcert -rfc \
            -keystore android/app/daidai-release.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" > "$RUNNER_TEMP/android-release.pem"
          ACTUAL_CERT_SHA256="$(openssl x509 -in "$RUNNER_TEMP/android-release.pem" -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          NORMALIZED_EXPECTED="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          if [[ ! "$NORMALIZED_EXPECTED" =~ ^[0-9A-F]{64}$ || "$ACTUAL_CERT_SHA256" != "$NORMALIZED_EXPECTED" ]]; then
            echo "::error::JKS 证书与 ANDROID_CERT_SHA256 不一致"
            exit 1
          fi
          cat > android/key.properties <<EOF
          storeFile=daidai-release.jks
          storePassword=${KEYSTORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF

      - name: Build Android APK
        run: |
          if [[ "$BUILD_MODE" == "release" ]]; then
            flutter build apk --release
            APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
            TARGET_NAME="Dumb-Panel-APP-${BUILD_MODE}.apk"
          else
            flutter build apk --debug
            APK_PATH="build/app/outputs/flutter-apk/app-debug.apk"
            TARGET_NAME="Dumb-Panel-APP-${BUILD_MODE}.apk"
          fi

          mkdir -p release
          cp "$APK_PATH" "release/$TARGET_NAME"

      - name: Verify release APK signing certificate
        if: env.BUILD_MODE == 'release'
        env:
          EXPECTED_CERT_SHA256: ${{ secrets.ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK_PATH="release/Dumb-Panel-APP-${BUILD_MODE}.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          ACTUAL_CERT_SHA256="$("$APKSIGNER" verify --print-certs "$APK_PATH" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          NORMALIZED_EXPECTED="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          if [[ "$ACTUAL_CERT_SHA256" != "$NORMALIZED_EXPECTED" ]]; then
            echo "::error::Android APK 签名证书与 ANDROID_CERT_SHA256 不一致"
            exit 1
          fi

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ env.BUILD_MODE }}-apk
          path: release/*.apk
          if-no-files-found: error
          retention-days: 7
